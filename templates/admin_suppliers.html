{% extends 'admin_base.html' %}{% block content %}
<main class="page"><section class="section-head page-head"><h1>Поставщики</h1><p>Добавление, редактирование и удаление поставщиков</p><a class="btn primary" href="{{ url_for('admin.admin_supplier_new') }}">Добавить поставщика</a></section><section class="admin-table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>Наименование</th><th>Почта</th><th></th></tr></thead><tbody>{% for s in suppliers %}<tr><td>{{ s.id }}</td><td>{{ s.name }}</td><td>{{ s.email }}</td><td class="admin-row-actions"><a class="btn small" href="{{ url_for('admin.admin_supplier_edit', supplier_id=s.id) }}">Редактировать</a><form method="post" action="{{ url_for('admin.admin_supplier_delete', supplier_id=s.id) }}" onsubmit="return confirm('Удалить поставщика?')"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="btn small light" type="submit">Удалить</button></form></td></tr>{% endfor %}</tbody></table></section></main>
{% endblock %}
