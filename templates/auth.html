{% extends 'base.html' %}{% set title='МармеладШоп43 | Вход и регистрация' %}{% block content %}<main class="auth-page"><section class="auth-box"><div class="tabs"><button class="tab active" data-tab="login">Логин</button><button class="tab" data-tab="register">Регистрация</button></div><form class="auth-form active" data-form="login" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="login"><h1>Вход</h1><input name="login" type="text" placeholder="Телефон или почта" required><div class="password-field"><input name="password" type="password" placeholder="Пароль" required><button type="button" data-toggle-password>◉</button></div><button class="btn primary full" type="submit">Войти</button></form><form class="auth-form" data-form="register" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="register"><h1>Регистрация</h1><input name="name" type="text" placeholder="ФИО" required><input name="phone" data-phone-mask type="tel" placeholder="+7 (___) ___-__-__" required><input name="email" type="email" placeholder="Почта" required><div class="password-field"><input name="password" type="password" placeholder="Пароль" minlength="6" required><button type="button" data-toggle-password>◉</button></div><button class="btn primary full" type="submit">Зарегистрироваться</button></form></section></main>{% endblock %}
