<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title or 'Админ-панель | МармеладШоп43' }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
<header class="header admin-header">
<a class="brand" href="{{ url_for('admin.admin_dashboard') }}"><img class="logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="МармеладШоп43"><span>Админ-панель</span></a>
<nav class="nav">
<a href="{{ url_for('admin.admin_dashboard') }}">Главная</a>
<a href="{{ url_for('admin.admin_products') }}">Ассортимент</a>
<a href="{{ url_for('admin.admin_suppliers') }}">Поставщики</a>
<a href="{{ url_for('admin.admin_clients') }}">Клиенты</a>
<a href="{{ url_for('public.index') }}">Сайт</a>
<a href="{{ url_for('admin.admin_logout') }}">Выход</a>
</nav>
</header>
{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
